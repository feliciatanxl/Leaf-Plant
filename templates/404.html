{% extends "index.html" %} 
{% block title %}404 Page Not Found - Leaf Plant{% endblock %}
{% block content %}
<div class="container vh-100 d-flex align-items-center justify-content-center text-center mt-5">
    <div class="card border-0 shadow-lg p-5 rounded-4" style="max-width: 500px;">
        <i class="bi bi-exclamation-octagon text-success display-1 mb-4"></i>
        
        <h1 class="fw-bold text-dark">404</h1>
        <h4 class="text-muted mb-4">Oops! This plant seems to have gone missing.</h4>
        
        <p class="mb-4 text-secondary">

        </p>

        <div class="d-grid gap-2">
            <a href="{{ url_for('index') }}" class="btn btn-success btn-lg rounded-pill shadow-sm">
                <i class="bi bi-house-door me-2"></i>Back to Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
