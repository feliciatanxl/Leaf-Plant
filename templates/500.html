{% extends "index.html" %}

{% block title %}System Error - Leaf Plant{% endblock %}

{% block content %}
<div class="container vh-100 d-flex align-items-center justify-content-center text-center mt-5">
    <div class="card border-0 shadow-lg p-5 rounded-4" style="max-width: 500px;">
        <i class="bi bi-cloud-slash text-danger display-1 mb-4"></i>
        
        <h1 class="fw-bold text-dark">500</h1>
        <h4 class="text-muted mb-4">Our systems are having a "wilt" moment.</h4>
        
        <p class="mb-4 text-secondary">
            Something went wrong on our end while processing your request. Our team (or AI) is looking into it!
        </p>

        <div class="d-grid gap-2">
            <a href="{{ url_for('index') }}" class="btn btn-success btn-lg rounded-pill shadow-sm">
                Try Returning Home
            </a>
            <button onclick="location.reload()" class="btn btn-outline-secondary rounded-pill">
                Refresh Page
            </button>
        </div>
    </div>
</div>
{% endblock %}
