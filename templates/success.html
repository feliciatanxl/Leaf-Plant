<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful | Fresh Farm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='global.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='navbar.css') }}">
</head>
<body>
    
    <nav class="navbar navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="/">
                <img src="{{ url_for('static', filename='image/Green Minimalist Leaf Plant Logo.png') }}" height="50">
            </a>
        </div>
    </nav>

    <div class="container text-center mt-5 pt-5">
        <div class="card border-0 shadow-sm p-5 rounded-4 d-inline-block">
            <div class="mb-4">
                <i class="bi bi-check-circle-fill text-success" style="font-size: 5rem;"></i>
            </div>
            <h1 class="fw-bold text-dark">Payment Successful!</h1>
            <p class="text-muted mb-4 lead">Thank you for your order. We will start harvesting your produce!</p>
            
            <a href="/product" class="btn btn-success rounded-pill px-5 py-3 fw-bold">
                Continue Shopping
            </a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            localStorage.removeItem('farmCart');
        });
    </script>
</body>
</html>
